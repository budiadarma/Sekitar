name: Jalankan Scraper Berita

on:
  workflow_dispatch: # Membuat tombol manual di web GitHub untuk menjalankan program

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal kebutuhan sistem
        run: pip install -r requirements.txt

      - name: Jalankan program pencari berita
        run: python scraper.py
